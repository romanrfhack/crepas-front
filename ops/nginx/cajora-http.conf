# Preparación HTTP: habilitar solo tras apuntar DNS al VPS y verificar el docroot.
# Luego emitir TLS: certbot --nginx -d cajora.leroa.com.mx --redirect
server {
    listen 80;
    server_name cajora.leroa.com.mx;
    root /var/www/cajora/web;
    index index.html;
    client_max_body_size 25m;

    location = / {
        try_files /cajora/index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /assets/build-info.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    # Health nunca debe responder con el index.html del SPA.
    location = /health/live { proxy_pass http://127.0.0.1:5005; }
    location = /health/ready { proxy_pass http://127.0.0.1:5005; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        add_header Cache-Control "private, no-store" always;
    }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:env|bak|sql|log|ini|yml|yaml|toml)$ { deny all; }
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
